<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Select your country for Casino World.">
        <title>Country Selection - Casino World</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="login-container country-pick">
            <h2>Select Your Country</h2>
            <form action="connecting.html" method="get">
                <button type="submit" name="country" value="ngn">
                    <span class="flag">
                        <svg viewBox="0 0 30 20" role="img" aria-label="Nigeria">
                            <rect width="30" height="20" fill="#ffffff"></rect>
                            <rect width="10" height="20" fill="#008751"></rect>
                            <rect x="20" width="10" height="20" fill="#008751"></rect>
                        </svg>
                    </span>
                    Nigeria
                </button>
                <button type="submit" name="country" value="gh">
                    <span class="flag">
                        <svg viewBox="0 0 30 20" role="img" aria-label="Ghana">
                            <rect width="30" height="20" fill="#006b3f"></rect>
                            <rect width="30" height="13.34" fill="#fcd116"></rect>
                            <rect width="30" height="6.67" fill="#ce1126"></rect>
                            <polygon points="15,4.6 16.35,8.7 20.7,8.7 17.2,11.2 18.5,15.3 15,12.8 11.5,15.3 12.8,11.2 9.3,8.7 13.65,8.7" fill="#000000"></polygon>
                        </svg>
                    </span>
                    Ghana
                </button>
            </form>
        </div>
        <script src="java.s"></script>
    </body>
</html>
