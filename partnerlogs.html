<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Sign in or apply to become a Casino World partner.">
        <title>Partner Access - Casino World</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="login-container partner-access">
            <h2>CASINO WORLD</h2>
            <p class="partner-kicker">Partner access</p>
            <div class="partner-tabs">
                <button type="button" class="is-on" data-partner-tab="sign-in">Sign in</button>
                <button type="button" data-partner-tab="join">Become a partner</button>
            </div>
            <form id="partner-sign-in">
                <label for="partner-email">Email</label>
                <input type="email" id="partner-email" name="email" placeholder="you@email.com" autocomplete="email" required>
                <label for="partner-password">Password</label>
                <input type="password" id="partner-password" name="password" placeholder="Password" autocomplete="current-password" required>
                <p class="admin-lock-error" id="partner-sign-in-error" hidden>That email or password is not correct.</p>
                <button type="submit">Sign in</button>
            </form>
            <form id="partner-join" hidden>
                <label for="join-name">Full name</label>
                <input type="text" id="join-name" name="name" autocomplete="name" required>
                <label for="join-email">Email</label>
                <input type="email" id="join-email" name="email" autocomplete="email" required>
                <label for="join-password">Password</label>
                <input type="password" id="join-password" name="password" autocomplete="new-password" minlength="6" required>
                <p id="partner-join-note" hidden></p>
                <button type="submit">Become a partner</button>
            </form>
            <p class="note">New partners must be approved by an admin before first sign-in.</p>
            <a class="button back-link" href="index.html">Back to site</a>
        </div>
        <div class="wait-popup" id="partner-wait-popup" hidden>
            <div class="wait-popup-card" role="dialog" aria-modal="true" aria-labelledby="partner-wait-title">
                <div class="wait-signal" aria-hidden="true"><span></span><span></span><span></span><i></i></div>
                <p class="kicker">Waiting</p>
                <h2 id="partner-wait-title">Waiting for approval</h2>
                <p>Your application was sent to the admin. You can sign in after it is approved.</p>
                <button type="button" id="partner-wait-close">OK</button>
            </div>
        </div>
        <script src="java.s"></script>
    </body>
</html>
