<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Casino World admin settings.">
        <title>Settings - Casino World</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="admin">
        <div class="login-container connect-card admin-lock" id="admin-lock">
            <h2>Admin access</h2>
            <form id="admin-lock-form">
                <label for="admin-code">Access code</label>
                <input id="admin-code" name="code" type="password" inputmode="numeric" autocomplete="off" maxlength="6" required>
                <p class="admin-lock-error" id="admin-lock-error" hidden>That code is not correct.</p>
                <button type="submit">Enter</button>
            </form>
        </div>
        <header class="admin-header" hidden>
            <h2>CASINO WORLD <span>ADMIN</span></h2>
            <nav class="admin-nav">
                <a class="button" href="admin.html">Overview</a>
                <a class="button" href="admin.html#members">Members</a>
                <a class="button" href="admin.html#transactions">Transactions</a>
                <a class="button" href="admin.html#partners">Partners</a>
                <a class="button is-on" href="settings.html">Settings</a>
            </nav>
        </header>
        <main class="admin-main" hidden>
            <section class="admin-intro">
                <div>
                    <p class="kicker panel-name">Admin Control Panel</p>
                    <h1>Payment gateways</h1>
                </div>
                <button type="button" id="save-gateways">Save</button>
            </section>
            <p class="gateway-saved" id="gateway-saved" hidden>Saved.</p>
            <section class="settings-gateways">
                <article class="card settings-card">
                    <h2>MoMo</h2>
                    <p>Ghana Mobile Money</p>
                    <ul class="gateway-list">
                        <li><label for="momo-network">Select network</label><select id="momo-network"><option value="">Select network</option><option>MTN MoMo</option><option>Telecel Cash</option><option>AirtelTigo Money</option></select></li>
                        <li><label for="momo-number">Number</label><input id="momo-number" placeholder="MoMo number"></li>
                        <li><label for="momo-name">Name</label><input id="momo-name" placeholder="Account name"></li>
                    </ul>
                </article>
                <article class="card settings-card">
                    <h2>Nigeria bank</h2>
                    <p>Naira bank transfer</p>
                    <ul class="gateway-list">
                        <li><label for="bank-bank">Select bank</label><select id="bank-bank"><option value="">Select bank</option><option>Access Bank</option><option>GTBank</option><option>Zenith Bank</option><option>First Bank</option><option>UBA</option><option>OPay</option><option>PalmPay</option><option>Kuda</option><option>Moniepoint</option><option>Fidelity Bank</option><option>FCMB</option><option>Sterling Bank</option><option>Wema Bank</option><option>Union Bank</option><option>Ecobank</option><option>Stanbic IBTC</option><option>Polaris Bank</option><option>Providus Bank</option></select></li>
                        <li><label for="bank-account">Account</label><input id="bank-account" placeholder="Account number"></li>
                        <li><label for="bank-name">Name</label><input id="bank-name" placeholder="Account name"></li>
                    </ul>
                </article>
                <article class="card settings-card settings-prices">
                    <h2>Prices</h2>
                    <p>Package prices and session times</p>
                    <ul class="gateway-list">
                        <li><label for="time-1">Package 1 · minutes</label><input id="time-1" inputmode="numeric" value="3"></li>
                        <li><label for="price-gh-1">Package 1 · GHS</label><input id="price-gh-1" inputmode="decimal" value="355"></li>
                        <li><label for="price-ngn-1">Package 1 · NGN</label><input id="price-ngn-1" inputmode="decimal" value="42472.20"></li>
                        <li><label for="time-2">Package 2 · minutes</label><input id="time-2" inputmode="numeric" value="10"></li>
                        <li><label for="price-gh-2">Package 2 · GHS</label><input id="price-gh-2" inputmode="decimal" value="455"></li>
                        <li><label for="price-ngn-2">Package 2 · NGN</label><input id="price-ngn-2" inputmode="decimal" value="54436.20"></li>
                        <li><label for="time-3">Package 3 · minutes</label><input id="time-3" inputmode="numeric" value="15"></li>
                        <li><label for="price-gh-3">Package 3 · GHS</label><input id="price-gh-3" inputmode="decimal" value="555"></li>
                        <li><label for="price-ngn-3">Package 3 · NGN</label><input id="price-ngn-3" inputmode="decimal" value="66400.20"></li>
                    </ul>
                </article>
            </section>
        </main>
        <script src="java.s"></script>
    </body>
</html>
