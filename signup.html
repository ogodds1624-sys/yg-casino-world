<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Sign up for Casino World to get the latest insights and tips.">
        <title>Sign Up - Casino World</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="login-container">
            <h2>Sign Up for Casino World</h2>
            <form id="signup-form" action="country.html">
                <label for="signup-name">Full name:</label>
                <input type="text" id="signup-name" name="full-name" autocomplete="name" placeholder="Your full name" required>
                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" name="email" autocomplete="email" placeholder="you@email.com" required>
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" name="password" autocomplete="new-password" placeholder="Create a password" required>
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
        <script src="java.s"></script>
    </body>
</html>
