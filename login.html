<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Login to Casino World for the latest insights and tips.">
        <title>Login - Casino World</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="login-container">
            <h2>Login to Casino World</h2>
            <form id="login-form" action="country.html">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@email.com" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
        <script src="java.s"></script>
    </body>
</html>
