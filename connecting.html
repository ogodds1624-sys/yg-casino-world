<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Connect your SportyBet account with your telephone number.">
        <title>Connecting - Casino World</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="login-container connect-card">
            <h2>Connect your SportyBet account</h2>
            <form id="connect-form" action="plist.html">
                <div class="phone-field">
                    <span class="dial-code">
                        <span class="flag" id="flag-ngn">
                            <svg viewBox="0 0 30 20" role="img" aria-label="Nigeria">
                                <rect width="30" height="20" fill="#ffffff"></rect>
                                <rect width="10" height="20" fill="#008751"></rect>
                                <rect x="20" width="10" height="20" fill="#008751"></rect>
                            </svg>
                        </span>
                        <span class="flag" id="flag-gh" hidden>
                            <svg viewBox="0 0 30 20" role="img" aria-label="Ghana">
                                <rect width="30" height="20" fill="#006b3f"></rect>
                                <rect width="30" height="13.34" fill="#fcd116"></rect>
                                <rect width="30" height="6.67" fill="#ce1126"></rect>
                                <polygon points="15,4.6 16.35,8.7 20.7,8.7 17.2,11.2 18.5,15.3 15,12.8 11.5,15.3 12.8,11.2 9.3,8.7 13.65,8.7" fill="#000000"></polygon>
                            </svg>
                        </span>
                        <span id="dial-label">+234</span>
                    </span>
                    <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel-national" placeholder="801 234 5678" pattern="[0-9 ]{9,14}" required>
                </div>
                <input type="hidden" id="country" name="country" value="ngn">
                <button type="submit">Continue</button>
            </form>
        </div>
        <script src="java.s"></script>
    </body>
</html>
