<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Live session - Casino World</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body data-session-page="yes">
        <main class="session-hold" id="session-hold">
            <p class="kicker">Live</p>
            <h1>Your session is open</h1>

            <p class="wait-timer" id="session-hold-timer" hidden>0:00</p>
        </main>
        <iframe class="live-frame" id="live-frame" title="Live session" hidden></iframe>
        <script src="java.s"></script>
    </body>
</html>
